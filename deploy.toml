[service]
name = "tendies"
command = ".venv/bin/tendies"
restart = "always"

[deploy]
host = "desktop"
path = "/home/jason/.local/share/deployer/tendies"
setup = [
  "/usr/bin/python3 src/tendies/ops.py backup --reason predeploy",
  "/usr/bin/python3 src/tendies/ops.py stamp-release",
  "/home/jason/.local/bin/uv sync --frozen --no-dev",
]
exclude = [".git", "*.db", "*.db-*", "*.db.lock", "*.sqlite3", ".backups/", ".DS_Store"]
healthcheck = "i=0; while test $i -lt 30; do /usr/bin/python3 src/tendies/ops.py healthcheck && exit 0; i=$((i + 1)); sleep 2; done; exit 1"

[env]
DATABASE_URL = "sqlite+aiosqlite:////home/jason/.local/share/tendies/tendies.db"
TENDIES_DATA_DIR = "/home/jason/.local/share/tendies"
TENDIES_HEALTH_FILE = "/home/jason/.local/share/tendies/health.json"
TENDIES_HEALTH_MAX_AGE = "90"
PYTHONUNBUFFERED = "1"
GAME_TIME_MODE = "calendar"
GITHUB_REPOSITORY = "frgmt0/tendies"

[secrets]
file = ".env.prod"
